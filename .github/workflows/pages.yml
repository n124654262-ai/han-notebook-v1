name: Deploy HAN 筆記本

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取出網站檔案
        uses: actions/checkout@v4
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 整理靜態網站
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/employee
          cp index.html app.js styles.css firebase-config.js submit.js 404.html _site/
          cp employee/index.html _site/employee/index.html
      - name: 打包靜態網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
