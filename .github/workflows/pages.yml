name: Deploy HAN Notebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取出網站檔案
        uses: actions/checkout@v4
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 只打包網站檔案
        run: |
          mkdir site
          cp index.html app.js styles.css firebase-config.js site/
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
